name: Dependency Review

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Dependency Review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # GHSA-2v4p-qf9q-27wj only affects servers built with xds.NewGRPCServer(); grpc-go
          # is pulled in transitively as an OTLP log-export client and never runs an xDS
          # server here. No stable release fixes it yet (only master and 1.82.2/1.83.2
          # backports), so pinning a version can't resolve this - it's a genuine false
          # positive for this codebase.
          allow-ghsas: GHSA-2v4p-qf9q-27wj
